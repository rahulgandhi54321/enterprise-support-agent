[project]
name = "enterprise-support-agent"
version = "0.1.0"
description = "Enterprise customer support operator prototype — OpenAI and Claude API."
requires-python = ">=3.10"
dependencies = [
  "cohere>=7.0.0",
  "fastapi>=0.115.0",
  "openai>=1.0.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["support_operator*"]
